<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>固定汇率多币种换算器</title>

<style>
* {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Helvetica Neue",
    Arial, sans-serif;
}

body {
    margin: 0;
    background: #f5f5f7;
    color: #1d1d1f;
}

.container {
    max-width: 520px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

h1 {
    font-size: 26px;
    margin-bottom: 8px;
}

.subtitle {
    color:#86868b;
    font-size:14px;
    margin-bottom:20px;
}

.warning {
    background:#fff3cd;
    color:#856404;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    margin-bottom:20px;
}


.formula {
    background:#f5f5f7;
    padding:14px;
    border-radius:14px;
    font-size:14px;
    margin-bottom:20px;
}


.currency-item {
    padding:16px;
    border-radius:18px;
    margin-bottom:12px;
    border:1px solid #e5e5ea;
    transition:.2s;
}


.currency-item.active {
    border:2px solid #007aff;
    background:#f0f7ff;
}


.currency-header {
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}


.currency-name {
    font-weight:600;
}


.rate {
    color:#86868b;
    font-size:12px;
}


input {
    width:100%;
    border:none;
    outline:none;
    font-size:24px;
    background:transparent;
    font-weight:500;
}


.buttons {
    display:flex;
    gap:12px;
    margin-top:20px;
}


button {
    flex:1;
    border:none;
    padding:14px;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
}


.clear {
    background:#f2f2f7;
}


.copy {
    background:#007aff;
    color:white;
}


.footer {
    text-align:center;
    margin-top:20px;
    color:#86868b;
    font-size:12px;
}


@media(max-width:600px){

.container{
    margin:10px auto;
}

.card{
    padding:20px;
}

h1{
    font-size:22px;
}

}
</style>

</head>


<body>

<div class="container">

<div class="card">

<h1>固定汇率多币种换算器</h1>

<div class="subtitle">
以人民币 CNY 为计算中枢
</div>


<div class="warning">
固定参数，不代表实时市场汇率
</div>


<div class="formula">
换算逻辑：
<br>
任意币种 → 人民币 → 其他币种
<br><br>
当地货币 ÷ 固定汇率 = 人民币
<br>
人民币 × 固定汇率 = 当地货币
</div>


<div id="currencyList"></div>


<div class="buttons">

<button class="clear" onclick="clearAll()">
清空金额
</button>


<button class="copy" onclick="copyResult()">
复制结果
</button>

</div>


<div class="footer">
所有汇率均为用户指定固定参数
</div>


</div>

</div>



<script>


const currencies = [

{
code:"CNY",
name:"人民币",
rate:1,
decimal:1
},

{
code:"SGD",
name:"新加坡元",
rate:0.18,
decimal:1
},

{
code:"VND",
name:"越南盾",
rate:3762,
decimal:0
},

{
code:"IDR",
name:"印尼盾",
rate:2397,
decimal:0
},

{
code:"MYR",
name:"马来西亚令吉",
rate:0.58,
decimal:1
},

{
code:"PHP",
name:"菲律宾比索",
rate:8.46,
decimal:0
},

{
code:"THB",
name:"泰铢",
rate:4.49,
decimal:0
}

];


let values={};

let active="CNY";



currencies.forEach(c=>{
    values[c.code]=0;
});



const list=document.getElementById("currencyList");



function formatMoney(value,currency){

    return Number(value)
    .toFixed(currency.decimal);

}



function render(){

list.innerHTML="";


currencies.forEach(c=>{


let div=document.createElement("div");

div.className=
"currency-item "+
(active===c.code?"active":"");


div.innerHTML=`

<div class="currency-header">

<div class="currency-name">
${c.name} ${c.code}
</div>

<div class="rate">
1 CNY = ${c.rate} ${c.code}
</div>

</div>


<input

type="number"

step="any"

value="${formatMoney(values[c.code],c)}"

data-code="${c.code}"

>

`;


let input=div.querySelector("input");


input.addEventListener("focus",()=>{

active=c.code;

render();

});


input.addEventListener("input",(e)=>{


active=c.code;


let inputValue=
parseFloat(e.target.value)||0;


updateCurrency(
c.code,
inputValue
);


});


list.appendChild(div);


});


}



function updateCurrency(code,inputValue){


let c=
currencies.find(x=>x.code===code);



let cny;



if(code==="CNY"){

cny=inputValue;

}

else{

cny=inputValue/c.rate;

}



currencies.forEach(item=>{

values[item.code]
=
cny*item.rate;

});


render();


}



function clearAll(){

currencies.forEach(c=>{

values[c.code]=0;

});


active="CNY";

render();

}



function copyResult(){


let text="固定汇率多币种换算结果\n\n";


currencies.forEach(c=>{

text+=
`${c.name} ${c.code}: ${formatMoney(values[c.code],c)}\n`;

});


text+=
"\n汇率为固定参数，不代表实时市场汇率";


navigator.clipboard.writeText(text)
.then(()=>{

alert("复制成功");

});


}



render();


</script>


</body>
</html>
