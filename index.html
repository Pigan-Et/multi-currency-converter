<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>固定汇率多币种换算器</title>

<style>

*{
    box-sizing:border-box;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    Arial,
    sans-serif;
}


body{

    margin:0;
    background:#f5f5f7;
    color:#1d1d1f;

}



.container{

    max-width:760px;
    margin:40px auto;
    padding:20px;

}



.card{

    background:white;
    border-radius:32px;
    padding:32px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.08);

}



h1{

    font-size:30px;
    margin:0 0 8px;

}



.subtitle{

    color:#86868b;
    font-size:14px;
    margin-bottom:25px;

}



.currency-item{

    background:#fafafa;

    border:1px solid #e5e5ea;

    border-radius:22px;

    padding:18px;

    transition:.25s;

}



.currency-item:hover{

    transform:translateY(-2px);

}



.currency-item.active{

    border:2px solid #007aff;

    background:#f0f7ff;

    transform:scale(1.02);

}



.cny-box{

    background:
    linear-gradient(
    135deg,
    #ffffff,
    #f7fbff
    );

    padding:24px;

    margin-bottom:20px;

}



.currency-header{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:10px;

}



.currency-name{

    font-weight:700;
    font-size:16px;

}



.rate{

    font-size:12px;
    color:#86868b;

}



input{

    width:100%;

    border:none;

    background:transparent;

    outline:none;

    font-size:32px;

    font-weight:700;

    color:#1d1d1f;

}



input::-webkit-inner-spin-button{

    display:none;

}



.other-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:14px;

}



.quick{

    display:flex;

    gap:10px;

    margin:20px 0;

}



.quick button{

    flex:1;

    border:none;

    background:#f2f2f7;

    padding:10px;

    border-radius:14px;

    cursor:pointer;

    transition:.2s;

}


.quick button:hover{

    background:#e5e5ea;

}



.buttons{

    display:flex;

    gap:12px;

    margin-top:25px;

}



button{

    border:none;

    border-radius:18px;

    padding:15px;

    font-size:15px;

    cursor:pointer;

}



.clear{

    flex:1;

    background:#f2f2f7;

}



.copy{

    flex:1;

    background:#007aff;

    color:white;

}



.toast{

    position:fixed;

    left:50%;

    bottom:40px;

    transform:
    translateX(-50%)
    translateY(20px);

    background:#1d1d1f;

    color:white;

    padding:12px 22px;

    border-radius:20px;

    opacity:0;

    transition:.3s;

}



.toast.show{

    opacity:1;

    transform:
    translateX(-50%)
    translateY(0);

}



@media(max-width:600px){


.container{

    margin:10px auto;

    padding:12px;

}


.card{

    padding:20px;

}


h1{

    font-size:24px;

}


.other-grid{

    grid-template-columns:
    repeat(2,1fr);

}


input{

    font-size:25px;

}


.quick button:nth-child(n+4){

    display:none;

}

}


</style>

</head>



<body>


<div class="container">


<div class="card">


<h1>
💱 固定汇率换算器
</h1>


<div class="subtitle">

固定汇率工具 · 非实时市场汇率

</div>



<div id="currencyList"></div>



<div class="quick">

<button onclick="quick(10)">
¥10
</button>

<button onclick="quick(50)">
¥50
</button>

<button onclick="quick(100)">
¥100
</button>

<button onclick="quick(500)">
¥500
</button>

</div>



<div class="buttons">

<button class="clear" onclick="clearAll()">
清空
</button>


<button class="copy" onclick="copyResult()">
复制结果
</button>

</div>



</div>

</div>



<div class="toast" id="toast">
复制成功
</div>



<script>


const currencies=[


{
code:"CNY",
name:"人民币",
symbol:"¥",
rate:1,
decimal:1
},


{
code:"SGD",
name:"新加坡元",
symbol:"S$",
rate:0.18,
decimal:1
},


{
code:"MYR",
name:"马来西亚令吉",
symbol:"RM",
rate:0.58,
decimal:1
},


{
code:"THB",
name:"泰铢",
symbol:"฿",
rate:4.49,
decimal:0
},


{
code:"IDR",
name:"印尼盾",
symbol:"Rp",
rate:2397,
decimal:0
},


{
code:"VND",
name:"越南盾",
symbol:"₫",
rate:3762,
decimal:0
},


{
code:"PHP",
name:"菲律宾比索",
symbol:"₱",
rate:8.46,
decimal:0
},


{
code:"USD",
name:"美元",
symbol:"$",
rate:0.14,
decimal:2
}


];



let values={};

currencies.forEach(c=>{
values[c.code]=0;
});


let active="CNY";


const list=
document.getElementById("currencyList");



function format(value,c){

return Number(value)
.toLocaleString(
"en-US",
{
minimumFractionDigits:c.decimal,
maximumFractionDigits:c.decimal
}
);

}



function createCard(c){


let div=document.createElement("div");


div.className="currency-item";


div.dataset.code=c.code;



div.innerHTML=`

<div class="currency-header">

<div class="currency-name">

${c.symbol} ${c.name} ${c.code}

</div>


<div class="rate">

1 CNY=${c.rate}

</div>

</div>


<input value="0" type="number">

`;



let input=
div.querySelector("input");



input.onfocus=()=>{

active=c.code;

document
.querySelectorAll(".currency-item")
.forEach(x=>
x.classList.remove("active")
);

div.classList.add("active");

};



input.oninput=()=>{


active=c.code;


let amount=
Number(input.value)||0;


let cny;


if(c.code==="CNY"){

cny=amount;

}else{

cny=
amount/c.rate;

}



currencies.forEach(item=>{

values[item.code]
=
cny*item.rate;

});


update();

};



return div;

}




function update(){


document
.querySelectorAll(".currency-item")
.forEach(div=>{


let code=
div.dataset.code;


if(code!==active){


let c=
currencies.find(
x=>x.code===code
);


div.querySelector("input")
.value=
format(values[code],c);


}



});


}





let main=
createCard(currencies[0]);


main.classList.add("cny-box");


list.appendChild(main);



let grid=
document.createElement("div");


grid.className="other-grid";


currencies
.slice(1)
.forEach(c=>{

grid.appendChild(
createCard(c)
);

});


list.appendChild(grid);





function quick(num){

active="CNY";

values.CNY=num;

currencies.forEach(c=>{

values[c.code]
=
num*c.rate;

});


update();

}




function clearAll(){

currencies.forEach(c=>{

values[c.code]=0;

});


active="CNY";


update();


}



function copyResult(){


let text=
"💱 固定汇率换算结果\n\n";


currencies.forEach(c=>{

text+=
`${c.symbol}${c.name} ${c.code}: ${format(values[c.code],c)}\n`;

});


navigator.clipboard
.writeText(text)
.then(()=>{

let toast=
document.getElementById("toast");

toast.classList.add("show");


setTimeout(()=>{

toast.classList.remove("show");

},1500);


});


}



</script>


</body>

</html>
